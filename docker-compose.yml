# CPU by default. With an NVIDIA GPU + NVIDIA Container Toolkit:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: vn_legal_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: vn-legal-rag-api
    container_name: vn_legal_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Overrides the localhost URL from .env: inside Docker, Qdrant is the "qdrant" service
      - QDRANT_URL=http://qdrant:6333
    volumes:
      # Reuse downloaded HuggingFace models between runs
      - ~/.cache/huggingface:/root/.cache/huggingface
      # BM25 index (data/processed/bm25_index) built on the host
      - ./data:/app/data:ro
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: vn-legal-rag-ui
    container_name: vn_legal_ui
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
